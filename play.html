<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c27"><title>Motion / Run</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="play.css"></head>
<body><main class="play-viewport"><canvas id="game" tabindex="0" aria-label="Parkour scene. Space jump, wall jump or mantle; hold Space to catch a ledge; S slide, drop or buffer a landing roll; E dash; hold Q swing; F cable; Escape pause; R retry."></canvas>
<aside class="level-float floating" aria-label="Level information"><small id="level-subtitle">FINITE CHALLENGE</small><strong id="level-title">Loading…</strong><div class="level-meta"><span id="section-name">Preparing scene</span><span><b id="progress">0%</b> · <b id="clock">0.00 s</b></span></div><div class="route-progress"><span id="progress-bar"></span></div></aside>
<nav class="session-float floating" aria-label="Session controls"><a data-level-select href="levels.html" aria-label="Back to level selection" title="Level selection">←</a><button id="retry" aria-label="Retry section" title="Retry section (R)">↺</button><button id="pause" aria-label="Pause or resume" title="Pause / resume (Escape)">Ⅱ</button><button id="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">⛶</button></nav>
<aside class="hint-float floating" aria-live="polite"><span id="motion-state">READY</span><span id="hint">Read the scene. Find your line.</span></aside>
<details id="controls-panel" class="controls-float floating"><summary>Controls <kbd>?</kbd></summary><div id="action-buttons" aria-label="On-screen actions"></div><p>Hold SPACE to catch a marked ledge. SPACE climbs up; S drops. Press S before a hard landing to roll.</p><span id="art-status" class="sr-only" role="status"></span></details>
<div class="play-overlay" id="overlay"><div class="play-overlay-card"><div id="overlay-kicker">FIND YOUR LINE</div><h1 id="overlay-title">Get ready.</h1><p id="overlay-detail">Loading scene.</p><button id="continue" disabled>Loading…</button><a id="next-level" hidden>Next level ↗</a><button id="restart-run" class="overlay-restart" hidden>Restart run</button><a data-level-select class="overlay-back" href="levels.html">← Level select</a><nav class="overlay-navigation" aria-label="Game menu"><a href="modes.html">Mode select</a><a href="./">Main menu</a></nav></div></div>
</main><script type="module" src="src/play.js"></script></body></html>
